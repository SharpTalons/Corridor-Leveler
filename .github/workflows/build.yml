name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: DSP core and OBS filter tests
        run: ctest --test-dir build --output-on-failure
      - name: Load the plugins like a host, render the window
        run: |
          A="build/plugin/CorridorLeveler_artefacts/Release"
          xvfb-run -a build/plugin/corridor_plugin_check_artefacts/Release/corridor_plugin_check \
            --vst3 "$A/VST3/Corridor Leveler.vst3" --vst2 "$A/VST/libCorridor Leveler.so" --snapshots screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: window-screenshots
          path: screenshots/*.png

  windows:
    name: Windows build and installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: DSP core tests
        run: build\Release\corridor_tests.exe
      - name: Load the plugins like a host
        shell: bash
        run: |
          A="build/plugin/CorridorLeveler_artefacts/Release"
          build/plugin/corridor_plugin_check_artefacts/Release/corridor_plugin_check.exe \
            --vst3 "$A/VST3/Corridor Leveler.vst3" --vst2 "$A/VST/Corridor Leveler.dll" --snapshots screenshots
      - name: Stage files
        shell: bash
        run: |
          A="build/plugin/CorridorLeveler_artefacts/Release"
          mkdir -p stage/obs/data stage/vst3 stage/vst2 stage/app
          cp build/obs/Release/corridor-leveler.dll stage/obs/
          cp -r obs/data/. stage/obs/data/
          cp -r "$A/VST3/Corridor Leveler.vst3" stage/vst3/
          cp "$A/VST/Corridor Leveler.dll" stage/vst2/
          cp "$A/Standalone/Corridor Leveler.exe" stage/app/
          cp LICENSE stage/LICENSE.txt
          cp installer/README.txt stage/README.txt
      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSrcDir=$pwd\stage" "/DAppVersion=$ver" installer\corridor.iss
      - uses: actions/upload-artifact@v4
        with:
          name: CorridorLeveler-Windows-Setup
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CorridorLeveler-Windows-files
          path: stage/
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
