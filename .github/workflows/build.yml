name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Every commit on main publishes a GitHub Release with the Windows installer.
# Version = MAJOR.MINOR from the VERSION file + number of commits on main (e.g. 0.1.23).

# a new push to a branch cancels its older run; main always runs to the end (it publishes releases)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: DSP core tests
        run: ctest --test-dir build --output-on-failure
      - name: Load the plugins like a host, render the window
        run: |
          A="build/plugin/CorridorLeveler_artefacts/Release"
          xvfb-run -a build/plugin/corridor_plugin_check_artefacts/Release/corridor_plugin_check \
            --vst3 "$A/VST3/Corridor Leveler.vst3" --vst2 "$A/VST/libCorridor Leveler.so" --snapshots screenshots
      - uses: actions/upload-artifact@v5
        with:
          name: window-screenshots
          path: screenshots/*.png

  windows:
    name: Windows build and installer
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Work out the version
        shell: bash
        run: |
          base=$(tr -d ' \r\n' < VERSION)
          n=$(git rev-list --count HEAD)
          echo "VERSION=$base.$n" >> "$GITHUB_ENV"
          echo "Version: $base.$n"
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCORRIDOR_VERSION=${{ env.VERSION }}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: DSP core tests
        run: build\Release\corridor_tests.exe
      - name: Load the plugins like a host
        shell: bash
        timeout-minutes: 15
        run: |
          A="build/plugin/CorridorLeveler_artefacts/Release"
          build/plugin/corridor_plugin_check_artefacts/Release/corridor_plugin_check.exe \
            --vst3 "$A/VST3/Corridor Leveler.vst3" --vst2 "$A/VST/Corridor Leveler.dll" --snapshots screenshots
      - name: Stage files
        shell: bash
        run: |
          A="build/plugin/CorridorLeveler_artefacts/Release"
          mkdir -p stage/vst3 stage/vst2
          cp -r "$A/VST3/Corridor Leveler.vst3" stage/vst3/
          cp "$A/VST/Corridor Leveler.dll" stage/vst2/
          cp LICENSE stage/LICENSE.txt
          cp installer/README.txt stage/README.txt
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DSrcDir=$pwd\stage" "/DAppVersion=$env:VERSION" installer\corridor.iss
      - uses: actions/upload-artifact@v5
        with:
          name: CorridorLeveler-Windows-Setup
          path: dist/*.exe
      - uses: actions/upload-artifact@v5
        with:
          name: CorridorLeveler-Windows-files
          path: stage/
      - name: Publish release (commits on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Corridor Leveler ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          generate_release_notes: true
          make_latest: true
          body: |
            Windows installer for Corridor Leveler ${{ env.VERSION }}: the VST3 and 2.x plugins (OBS loads the 2.x plugin).
            Download **CorridorLeveler-${{ env.VERSION }}-Windows-Setup.exe** below, run it, then restart OBS.
